# Free Supabase projects pause after 7 days without activity. This touches
# the database every 3 days through the public ping() function (it reads one
# count, exposes nothing). Needs two repository secrets:
#   SUPABASE_URL                  https://<project-ref>.supabase.co
#   SUPABASE_PUBLISHABLE_KEY      the publishable (anon) key -- never the secret key
name: supabase-keepalive
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: ping
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" || { echo "set the SUPABASE_URL secret"; exit 1; }
          curl -fsS --retry 3 -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Content-Type: application/json" -d '{}'
